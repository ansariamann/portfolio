<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

  <!-- Theme flash prevention -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var isDark = t !== null ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (!isDark) {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

<body class="min-h-screen bg-background text-foreground antialiased selection:bg-accent/35 selection:text-ink">

  <!-- Header matching site design -->
  <header id="main-header" class="sticky top-0 z-50 w-full border-b border-ink/10 bg-background/95 backdrop-blur-sm transition-colors">
    <div class="container-wide flex items-center justify-between py-3">
      <div class="flex items-center gap-4">
        <a href="index.html" class="flex items-center">
          <img src="images/signature.png" alt="Aman Ansari" class="h-10 w-auto object-contain dark:invert" />
        </a>
        <span class="text-ink/20">/</span>
        <a href="index.html" class="text-xs font-mono font-semibold uppercase tracking-wider text-muted-foreground hover:text-foreground flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Back to Home

      </div>

      <div class="flex items-center gap-3">
        <a href="case-studies.html" class="text-xs font-mono font-semibold uppercase tracking-wider text-muted-foreground hover:text-foreground hidden sm:inline">
          Case Studies →
        </a>

        <!-- Dark Mode Toggle -->
        <button
          id="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          class="group relative size-9 flex items-center justify-center rounded-md border border-ink/10 text-muted-foreground transition-colors hover:bg-ink/5 hover:text-foreground"
        >
          <svg class="lucide-sun w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg class="lucide-moon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>

  <main id="main-content" class="pt-16 pb-24">
    <div class="container-main max-w-6xl">
      <!-- Page Banner -->
      <header class="mb-12">
        <p class="section-label mb-3">Portfolio Archive</p>
        <h1 class="text-4xl sm:text-5xl font-extrabold text-foreground tracking-tight">All Projects</h1>
        <p class="mt-4 text-base sm:text-lg text-muted-foreground leading-relaxed max-w-2xl">
          Complete production systems, full-stack web applications, and intelligent machine learning models.
        </p>
      </header>

      <!-- Search & Filters Bar -->
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 mb-10 pb-6 border-b border-ink/10">
        <!-- Category Buttons -->
        <div class="flex flex-wrap gap-2">
          <button data-project-filter="all" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-foreground text-background border-foreground cursor-pointer">
            All Projects
          </button>
          <button data-project-filter="web" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-transparent text-muted-foreground border-ink/15 hover:border-ink/30 hover:text-foreground cursor-pointer">
            Web &amp; SaaS
          </button>
          <button data-project-filter="ml" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-transparent text-muted-foreground border-ink/15 hover:border-ink/30 hover:text-foreground cursor-pointer">
            Machine Learning
          </button>
          <button data-project-filter="fullstack" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-transparent text-muted-foreground border-ink/15 hover:border-ink/30 hover:text-foreground cursor-pointer">
            Java &amp; Enterprise
          </button>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-72">
          <input type="text" id="project-search" placeholder="Search by name, tech..." class="form-input !h-10 !text-sm pl-9">
          <svg class="w-4 h-4 text-muted-foreground absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>

      <!-- Projects Grid -->

        <!-- Rendered by js/projects.js -->

  <!-- Footer -->

    <div class="container-main max-w-6xl flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-muted-foreground">

      <div class="flex items-center gap-6 font-medium">
        <a href="index.html" class="hover:text-foreground">Home</a>

        <a href="index.html#contact" class="hover:text-foreground">Contact</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
