<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <!-- Theme flash prevention -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var isDark = t !== null ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (!isDark) {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Projects — Aman Ansari</title>
  <meta name="description" content="Showcase of projects built by Aman Ansari across full-stack development, machine learning, and systems architecture.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="canonical" href="https://ansariaman.netlify.app/projects.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ansariaman.netlify.app/projects.html">
  <meta property="og:title" content="Projects — Aman Ansari">
  <meta property="og:description" content="Showcase of projects built by Aman Ansari across full-stack development, machine learning, and systems architecture.">
  <meta property="og:image" content="https://ansariaman.netlify.app/images/about-photo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Projects — Aman Ansari">
  <meta name="twitter:description" content="Showcase of projects built by Aman Ansari across full-stack development, machine learning, and systems architecture.">
  <meta name="twitter:image" content="https://ansariaman.netlify.app/images/about-photo.png">

  <!-- Preconnect & Google Fonts: Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

  <!-- Exact compiled production stylesheet with all Hashton design system tokens & Tailwind utilities -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-background text-foreground antialiased selection:bg-accent/35 selection:text-ink">

  <!-- Header matching site design -->
  <header id="main-header" class="sticky top-0 z-50 w-full border-b border-ink/10 bg-background/95 backdrop-blur-sm transition-colors">
    <div class="container-wide flex items-center justify-between py-3">
      <div class="flex items-center gap-4">
        <a href="index.html" class="flex items-center">
          <img src="images/signature.png" alt="Aman Ansari" class="h-10 w-auto object-contain dark:invert" />
        </a>
        <span class="text-ink/20">/</span>
        <a href="index.html" class="text-xs font-mono font-semibold uppercase tracking-wider text-muted-foreground hover:text-foreground flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Back to Home
        </a>
      </div>

      <div class="flex items-center gap-3">
        <a href="case-studies.html" class="text-xs font-mono font-semibold uppercase tracking-wider text-muted-foreground hover:text-foreground hidden sm:inline">
          Case Studies →
        </a>

        <!-- Dark Mode Toggle -->
        <button
          id="theme-toggle"
          type="button"
          aria-label="Toggle theme"
          class="group relative size-9 flex items-center justify-center rounded-md border border-ink/10 text-muted-foreground transition-colors hover:bg-ink/5 hover:text-foreground cursor-pointer"
        >
          <!-- Sun icon (shown in light mode) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <!-- Moon icon (shown in dark mode) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <span id="theme-tooltip" class="pointer-events-none absolute top-full mt-2 left-1/2 -translate-x-1/2 whitespace-nowrap rounded bg-foreground px-2 py-0.5 font-mono text-[11px] font-medium text-background shadow opacity-0 transition-opacity duration-150 group-hover:opacity-100 z-50">Dark mode</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="pt-16 pb-24">
    <div class="container-main max-w-6xl">
      <!-- Page Banner -->
      <header class="mb-12">
        <p class="section-label mb-3">Portfolio Archive</p>
        <h1 class="text-4xl sm:text-5xl font-extrabold text-foreground tracking-tight">All Projects</h1>
        <p class="mt-4 text-base sm:text-lg text-muted-foreground leading-relaxed max-w-2xl">
          Complete production systems, full-stack web applications, and intelligent machine learning models.
        </p>
      </header>

      <!-- Search & Filters Bar -->
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 mb-10 pb-6 border-b border-ink/10">
        <!-- Category Buttons -->
        <div class="flex flex-wrap gap-2">
          <button data-project-filter="all" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-foreground text-background border-foreground cursor-pointer">
            All Projects
          </button>
          <button data-project-filter="web" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-transparent text-muted-foreground border-ink/15 hover:border-ink/30 hover:text-foreground cursor-pointer">
            Web &amp; SaaS
          </button>
          <button data-project-filter="ml" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-transparent text-muted-foreground border-ink/15 hover:border-ink/30 hover:text-foreground cursor-pointer">
            Machine Learning
          </button>
          <button data-project-filter="fullstack" class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all border bg-transparent text-muted-foreground border-ink/15 hover:border-ink/30 hover:text-foreground cursor-pointer">
            Java &amp; Enterprise
          </button>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-72">
          <input type="text" id="project-search" placeholder="Search by name, tech..." class="form-input !h-10 !text-sm pl-9">
          <svg class="w-4 h-4 text-muted-foreground absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Projects Grid -->
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered by js/projects.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-ink/10 bg-background py-10">
    <div class="container-main max-w-6xl flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-muted-foreground">
      <p>© 2026 Aman Ansari. All rights reserved.</p>
      <div class="flex items-center gap-6 font-medium">
        <a href="index.html" class="hover:text-foreground">Home</a>
        <a href="case-studies.html" class="hover:text-foreground">Case Studies</a>
        <a href="index.html#contact" class="hover:text-foreground">Contact</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
